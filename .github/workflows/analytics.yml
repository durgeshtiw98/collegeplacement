name: Analytics verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip_audit -r requirements.txt
      - name: Regression tests with branch coverage
        run: |
          PYTHONPATH=src coverage run -m unittest discover -s tests -v
          coverage report
      - name: Reproduce demo deliverables
        run: |
          PYTHONPATH=src python -m placement supplied
          PYTHONPATH=src python -m placement demo
          PYTHONPATH=src python -m placement run --demo
          PYTHONPATH=src python -m placement validate --demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-analytics
          path: |
            reports/supplied/
            reports/generated/
